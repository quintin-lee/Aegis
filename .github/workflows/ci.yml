# GitHub Actions CI for Aegis

name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitize: [none, asan, tsan]
        exclude:
          # tsan on clang has known issues with glibc malloc hooks
          - compiler: clang
            sanitize: tsan
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ clang valgrind libcurl4-openssl-dev libgtest-dev libsqlite3-dev

      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: |
          mkdir -p build
          # Use the project's sanitizer options: cmake/AegisSanitizers.cmake
          # applies -fsanitize via add_compile_options + add_link_options, so the
          # flag survives CXX-linked test targets (raw CMAKE_C_FLAGS does not).
          if [ "${{ matrix.sanitize }}" = "asan" ]; then
            SAN_OPT=-DAEGIS_ENABLE_ASAN=ON
          elif [ "${{ matrix.sanitize }}" = "tsan" ]; then
            SAN_OPT=-DAEGIS_ENABLE_TSAN=ON
          else
            SAN_OPT=
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAEGIS_BUILD_TESTS=ON \
            $SAN_OPT

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test (ASan)
        if: matrix.sanitize == 'asan'
        # Per-test ASAN env (LD_PRELOAD=, ASAN_OPTIONS=verify_asan_link_order=0)
        # is set by cmake/AegisTests.cmake; a shell-level preload would be
        # overridden for listed tests and harmful for unlisted ones.
        run: ctest --test-dir build --output-on-failure -E bench_
      - name: Test (TSan)
        if: matrix.sanitize == 'tsan'
        run: |
          TSAN_LIB=$(ldconfig -p | awk '/libtsan\.so/{print $NF; exit}')
          echo "TSAN_LIB=$TSAN_LIB"
          LD_PRELOAD="$TSAN_LIB" \
            ctest --test-dir build --output-on-failure -E bench_
      - name: Test (native)
        if: matrix.sanitize == 'none'
        run: ctest --test-dir build --output-on-failure -E bench_

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to the project's clang-format version so CI and local checks agree
      - name: Install clang-format
        run: python3 -m pip install clang-format==22.1.8
      - name: Check formatting
        run: |
          clang-format --version
          files=$(find . -type f \( -name '*.c' -o -name '*.h' \) \
            -not -path './build/*' -not -path './.git/*')
          for f in $files; do
            clang-format --dry-run --Werror "$f" || {
              echo "Formatting violation in $f"
              exit 1
            }
          done
